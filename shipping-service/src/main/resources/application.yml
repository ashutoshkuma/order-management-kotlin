spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5436/shippingdb
    username: shippinguser
    password: shippingpass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ShippingPool
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    jdbc:
      repositories:
        enabled: true

  jms:
    pub-sub-domain: true   # shipping-service only publishes, to a Solace Topic (not a Queue)

solace:
  jms:
    host: ${SOLACE_JMS_HOST:smf://localhost:55555}
    msg-vpn: ${SOLACE_JMS_MSG_VPN:default}
    client-username: ${SOLACE_JMS_CLIENT_USERNAME:default}
    client-password: ${SOLACE_JMS_CLIENT_PASSWORD:default}

simulation:
  shipping-failure-rate: 0.10

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.shipping: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n"

server:
  port: 8083

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
