spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5435/paymentdb
    username: paymentuser
    password: paymentpass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentPool
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    jdbc:
      repositories:
        enabled: true

  jms:
    pub-sub-domain: true   # payment-service only publishes, to a Solace Topic (not a Queue)

solace:
  jms:
    host: smf://localhost:55555
    msg-vpn: default
    client-username: default
    client-password: default

simulation:
  payment-failure-rate: 0.30
  payment-transient-ratio: 0.30   # 30% of failures are transient

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.payment: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n"

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
