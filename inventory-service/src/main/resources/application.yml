spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5434/inventorydb
    username: inventoryuser
    password: inventorypass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: InventoryPool
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    jdbc:
      repositories:
        enabled: true

  jms:
    pub-sub-domain: true   # inventory-service only publishes, to a Solace Topic (not a Queue)

solace:
  jms:
    host: smf://localhost:55555
    msg-vpn: default
    client-username: default
    client-password: default

simulation:
  inventory-failure-rate: 0.20  # 20% failure rate for testing

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.inventory: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{30} - %msg%n"

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
